name: Packaging smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  smoke:
    name: Packaged runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            smoke-command: xvfb-run -a npm run smoke
          - os: macos-latest
            smoke-command: npm run smoke
          - os: windows-latest
            smoke-command: npm run smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: dashboard
      - run: npm run pack:dir
      - run: ${{ matrix.smoke-command }}
        env:
          TOKKIE_SMOKE_ALLOW_PACKAGE_LAUNCH: '1'
