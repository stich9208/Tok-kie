name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: dashboard
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run smoke
      - run: npm test

  postgres-security:
    name: PostgreSQL security contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Run RLS and cloud contract checks
        env:
          TOKKIE_SECURITY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          set +e
          output="$(./supabase/run-security-tests.sh 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            output="${output//'%'/'%25'}"
            output="${output//$'\r'/'%0D'}"
            output="${output//$'\n'/'%0A'}"
            echo "::error file=supabase/security-test.sql,title=PostgreSQL security contract::$output"
            exit "$status"
          fi
