name: Release desktop packages

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  package-macos:
    name: Signed and notarized macOS package
    runs-on: macos-latest
    env:
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Require release signing and notarization credentials
        shell: bash
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: dashboard
      - run: npm run dist:mac:universal
      - run: npm run smoke
        env:
          TOKKIE_SMOKE_ALLOW_PACKAGE_LAUNCH: '1'
      - name: Verify signature, Gatekeeper assessment, and notarization staples
        shell: bash
        run: |
          APP_PATH="$(find release -type d -name 'Tok-kie.app' -print -quit)"
          DMG_PATH="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$APP_PATH"
          test -n "$DMG_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: tokkie-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
          if-no-files-found: error

  package-windows:
    name: Signed Windows package
    runs-on: windows-latest
    env:
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Require Windows signing credentials
        shell: pwsh
        run: |
          if (-not $env:CSC_LINK) { throw 'WIN_CSC_LINK is required' }
          if (-not $env:CSC_KEY_PASSWORD) { throw 'WIN_CSC_KEY_PASSWORD is required' }
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: dashboard
      - run: npm run dist:win:x64
      - run: npm run smoke
        env:
          TOKKIE_SMOKE_ALLOW_PACKAGE_LAUNCH: '1'
      - name: Verify Authenticode on every shipped executable
        shell: pwsh
        run: |
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $signTool = Get-ChildItem -LiteralPath $kits -Filter signtool.exe -Recurse |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signTool) { throw 'signtool.exe was not found' }
          $targets = Get-ChildItem -LiteralPath release -Filter *.exe -Recurse
          if (-not $targets) { throw 'No Windows executable was produced' }
          foreach ($target in $targets) {
            & $signTool.FullName verify /pa /all /v $target.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $($target.FullName)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: tokkie-windows
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-macos, package-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
