appId: com.stich9208.tokkie
productName: Tok-kie
copyright: Copyright © 2026 Jaewook Jung

protocols:
  - name: Tok-kie Protocol
    schemes:
      - tokkie

directories:
  output: dist
  buildResources: build

files:
  - "electron/dist/**/*"
  - "dashboard/.next/**/*"
  - "dashboard/public/**/*"
  - "collector/**/*"
  - "package.json"

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
