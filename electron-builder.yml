appId: com.stich9208.tokkie
productName: Tok-kie
copyright: Copyright © 2026 Jaewook Jung

protocols:
  - name: Tok-kie Protocol
    schemes:
      - tokkie

directories:
  output: release
  buildResources: build

asar: true
npmRebuild: false
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

files:
  - "electron/dist/electron/**/*.js"
  - "!electron/dist/electron/**/*.test.js"
  - "!electron/dist/electron/**/test{,/**/*}"
  - "electron/dist/shared/**/*.js"
  - "dashboard/out/**/*"
  - "supabase/schema.sql"
  - "package.json"

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  signAndEditExecutable: true

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
